csi-driver-nfs:
  storageClasses:
    - name: nfs
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      parameters:
        server: {{ param_nfs_kube_server }}
        share: {{ param_nfs_kube_data }}-{{ param_cluster_name }}
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4.1