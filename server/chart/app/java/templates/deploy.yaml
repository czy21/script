---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/scrape: "true"
    prometheus.io/path: "actuator/prometheus"
spec:
  selector:
    app: {{ include "app.fullname" . }}
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- with .Values.service.extraPorts }}
{{ toYaml . | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  annotations:
    helm.sh/revision: "{{ .Release.Revision }}"
spec:
  replicas: {{ .Values.param_replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ include "app.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "app.fullname" . }}
      annotations:
        helm.sh/revision: "{{ .Release.Revision }}"
    spec:
      {{- with .Values.pod }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ include "app.fullname" . }}
          image: "{{ include "app.image" . }}:{{ .Values.param_release_version }}"
          imagePullPolicy: "{{ include "app.imagePullPolicy" . }}"
          ports:
            - name: http
              containerPort: 8080
          {{- with .Values.container.extraPorts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
          {{- with .Values.container.extraArgs }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JAVA_OPTS
              value: {{ .Values.param_app_args }}
          {{- with .Values.container.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: conf
              mountPath: /app/config
            - name: data
              mountPath: /app/data/
              subPath: data
          # startupProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          #   periodSeconds: 5
          #   timeoutSeconds: 3
          #   failureThreshold: 30

          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: 8080
          #   periodSeconds: 5
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          #   successThreshold: 1

          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8080
          #   periodSeconds: 15
          #   timeoutSeconds: 3
          #   failureThreshold: 3
      volumes:
        - name: conf
          configMap:
            name: {{ include "app.fullname" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.param_data_claim_name }}