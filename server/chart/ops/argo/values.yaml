argo-workflows:
  fullnameOverride: argo-workflows
  controller:
    rbac:
      accessAllSecrets: true
      writeConfigMaps: true
    workflowNamespaces: []
    synchronization:
      mysql:
        host: {{ param_db_mysql_host }}
        port: {{ param_db_mysql_port }}
        database: argo
        userNameSecret:
          name: {{ param_role_name }}-mysql-config
          key: username
        passwordSecret:
          name: {{ param_role_name }}-mysql-config
          key: password
  artifactRepository:
    s3: 
      endpoint: "{{ param_s3_endpoint }}"
      bucket: "{{ param_s3_bucket or 'argo' }}"
      accessKeySecret:
        name: {{ param_role_name }}-artifact-credentials
        key: accessKey
      secretKeySecret:
        name: {{ param_role_name }}-artifact-credentials
        key: secretKey