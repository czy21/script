---
apiVersion: v1
kind: Secret
metadata:
  name: {{ param_role_name }}-artifact-credentials
  namespace: {{ param_namespace }}
stringData:
  accessKey: {{ param_s3_access_key }}
  secretKey: {{ param_s3_secret_key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ param_role_name }}-mysql-config
  namespace: {{ param_namespace }}
stringData:
  username: {{ param_db_mysql_username}}
  password: {{ param_db_mysql_password}}