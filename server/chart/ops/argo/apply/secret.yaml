apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ param_role_name }}-admin
  namespace: {{ param_namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ param_role_name }}-admin.service-account-token
  namespace: {{ param_namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ param_role_name }}-admin
type: kubernetes.io/service-account-token  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ param_role_name }}-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ param_role_name }}-workflows-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ param_namespace }}
  - kind: ServiceAccount
    name: {{ param_role_name }}-admin
    namespace: {{ param_namespace }}