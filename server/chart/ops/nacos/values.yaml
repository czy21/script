java-template:
  param_release_image: nacos/nacos-server
  param_release_version: "v3.3.0"
  param_data_claim_name: "data-app"
  param_replicas: "1"
  service:
    extraPorts:
      - name: api
        port: 8848
        targetPort: 8848
      - name: grpc
        port: 9848
        targetPort: grpc
  container:
    extraPorts:
      - name: api
        containerPort: 8848
      - name: grpc
        containerPort: 9848
    extraEnv:
      - name: NACOS_AUTH_TOKEN
        value: {{ param_nacos_auth_token }}
      - name: NACOS_AUTH_IDENTITY_KEY
        value: {{ param_nacos_identity_key }}
      - name: NACOS_AUTH_IDENTITY_VALUE
        value: {{ param_nacos_identity_value }}
      - name: PREFER_HOST_MODE
        value: hostname
      - name: MODE
        value: standalone
      - name: SPRING_DATASOURCE_PLATFORM
        value: mysql
      - name: MYSQL_SERVICE_HOST
        value: "{{ param_db_mysql_host }}"
      - name: MYSQL_SERVICE_DB_NAME
        value: nacos
      - name: MYSQL_SERVICE_PORT
        value: "{{ param_db_mysql_port }}"
      - name: MYSQL_SERVICE_USER
        value: "{{ param_db_mysql_username }}"
      - name: MYSQL_SERVICE_PASSWORD
        value: "{{ param_db_mysql_password }}"
      - name: MYSQL_SERVICE_DB_PARAM
        value: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true