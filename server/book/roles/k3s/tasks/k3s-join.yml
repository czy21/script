- name: k3s worker join
  shell: |
    sudo mkdir -p /etc/rancher/k3s
    sudo cp {{ param_remote_role_path }}/k3s-worker-config.yaml /etc/rancher/k3s/config.yaml
    curl -sfL {{ param_proxy and 'https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | INSTALL_K3S_MIRROR=cn' or 'https://get.k3s.io |' }} INSTALL_K3S_VERSION="v{{ param_k3s_version }}" INSTALL_K3S_EXEC="agent" K3S_TOKEN="{{ param_k3s_token }}" sh -s - --server https://{{ groups["master"][0] }}:6443
  when: inventory_hostname in groups["worker"]