- name: k3s prep
  shell: sh {{ param_remote_role_path }}/k3s-prep-{{ param_ansible_os_family }}.sh
  tags:
    - 'k3s-prep'

- name: k3s host
  import_tasks: k3s-host.yml
  tags:
    - 'k3s-host'

- name: k3s conf
  import_tasks: k3s-conf.yml
  tags:
    - 'k3s-conf'
    - 'k3s-init'
    - 'k3s-join'

- name: k3s init
  shell: |
    curl -sfL {{ param_proxy and 'https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | INSTALL_K3S_MIRROR=cn' or 'https://get.k3s.io |' }} INSTALL_K3S_VERSION="v{{ param_k3s_version }}" INSTALL_K3S_EXEC="server" K3S_TOKEN="{{ param_k3s_token }}" sh -s -
  when: inventory_hostname in groups["master"]
  tags:
    - 'k3s-init'

- name: k3s join
  shell: |
    curl -sfL {{ param_proxy and 'https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | INSTALL_K3S_MIRROR=cn' or 'https://get.k3s.io |' }} INSTALL_K3S_VERSION="v{{ param_k3s_version }}" INSTALL_K3S_EXEC="agent" K3S_TOKEN="{{ param_k3s_token }}" sh -s -
  when: inventory_hostname in groups["worker"]
  tags:
    - 'k3s-join'

- name: k3s post
  import_tasks: k3s-post.yml
  tags:
    - 'k3s-post'