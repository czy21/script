- name: hosts
  shell: |
    sudo hostnamectl set-hostname --static {{ param_node_name | split(',') | first }}
    cat {{ param_remote_role_path }}/k3s-host-{{ param_ansible_os_family }} | sudo tee /etc/hosts > /dev/null

- name: systemd-resolved
  shell: |
    cat {{ param_remote_role_path }}/k3s-host-resolved.conf | sudo tee /etc/systemd/resolved.conf.d/dns.conf > /dev/null
    sudo systemctl restart systemd-resolved.service
  when: param_ansible_os_family == "debian"