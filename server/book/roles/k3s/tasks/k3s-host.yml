- name: hosts
  shell: |
    sudo hostnamectl set-hostname --static {{ param_node_name | split(',') | first }}
    cat {{ param_remote_role_path }}/{{ param_ansible_os_family }}-host | sudo tee /etc/hosts > /dev/null

- name: systemd-resolved
  shell: |
    sudo install -m 0755 -d /etc/systemd/resolved.conf.d/
    cat {{ param_remote_role_path }}/resolved.conf | sudo tee /etc/systemd/resolved.conf.d/dns.conf > /dev/null
    sudo systemctl restart systemd-resolved.service
  when: param_ansible_os_family == "debian"