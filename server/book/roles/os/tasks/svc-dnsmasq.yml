- name: dnsmasq conf
  template: src=files/dnsmasq.conf dest={{ role_path }}/dnsmasq.conf
  tags:
    - "svc-dnsmasq"

- name: dnsmasq init
  shell: |
    sudo install -m 0755 -d /etc/dnsmasq.d
    cat {{ role_path }}/dnsmasq.conf | sudo tee /etc/dnsmasq.d/dnsmasq.conf > /dev/null
    sudo chmod 644 /etc/dnsmasq.d/dnsmasq.conf
    bash {{ param_remote_role_path }}/{{ param_ansible_os_family }}-dnsmasq.sh
    echo "nameserver 127.0.0.1" | sudo tee /etc/resolv.conf
    sudo systemctl enable dnsmasq --now
  tags:
    - "svc-dnsmasq"