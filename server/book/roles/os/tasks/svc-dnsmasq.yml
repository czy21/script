- name: dnsmasq conf
  template: src=files/dnsmasq.conf dest={{ param_remote_role_path }}/dnsmasq.conf
  tags:
    - "svc-dnsmasq"

- name: dnsmasq init
  shell: |
    sudo install -m 0755 -d /etc/dnsmasq.d
    cat {{ param_remote_role_path }}/dnsmasq.conf | sudo tee /etc/dnsmasq.d/dnsmasq.conf > /dev/null
    sudo chmod 644 /etc/dnsmasq.d/dnsmasq.conf
    bash {{ param_remote_role_path }}/{{ param_ansible_os_family }}-dnsmasq.sh
    sudo systemctl enable dnsmasq --now
    sudo systemctl restart dnsmasq
  tags:
    - "svc-dnsmasq"