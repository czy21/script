- name: valid
  assert:
    that: param_user_ssh_public_key | trim != ""
    fail_msg: param_user_ssh_public_key is empty
  tags:
    - "os"

- name: mirror
  shell: sh {{ param_remote_role_path }}/mirror.sh
  when: param_mirror_use_proxy
  tags:
    - "os"
    - "os-mirror"

- name: install
  shell: |-
    timedatectl set-timezone Asia/Shanghai
    sh {{ param_remote_role_path }}/{{ param_ansible_os_family }}.sh
  tags:
    - "os"

- name: sshd_config
  shell: |-
    tee /etc/ssh/sshd_config.d/99-custom.conf << EOF
    UseDNS no
    PermitRootLogin yes
    PasswordAuthentication no
    ClientAliveInterval 30
    EOF
  tags:
    - "os"
    - "os-sshd"

- name: tool
  shell: sh {{ param_remote_role_path }}/tool.sh
  tags:
    - "tool"

- include_tasks: "{{ item }}"
  with_fileglob:
    - "sdk*.yml"
    - "svc*.yml"
  tags:
    - always