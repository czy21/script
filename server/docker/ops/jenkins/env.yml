param_role_version: 2.586-jdk25
param_role_backups:
  - type: bind
    source: {{ param_docker_data }}/{{ param_role_name }}/conf
  - type: volume
    source: jenkins-data
    rsync_option: >-
      --exclude='_data/logs/'
      --exclude='_data/.cache/'
      --exclude='_data/caches/'
      --exclude='_data/.local/'
      --exclude='_data/.gradle/'
      --exclude='_data/.npm/'
      --exclude='_data/tools/'
      --exclude='_data/workspace/'
      --exclude='_data/jobs/***/builds/'