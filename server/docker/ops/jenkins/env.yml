param_role_version: 2.586-jdk25
param_role_backups:
  - type: bind
    source: {{ param_docker_data }}/{{ param_role_name }}/conf
  - type: volume
    source: jenkins-data
    rsync_option: >-
      --exclude='/jenkins-data/_data/logs/'
      --exclude='/jenkins-data/_data/.cache/'
      --exclude='/jenkins-data/_data/caches/'
      --exclude='/jenkins-data/_data/.local/'
      --exclude='/jenkins-data/_data/.gradle/'
      --exclude='/jenkins-data/_data/.npm/'
      --exclude='/jenkins-data/_data/tools/'
      --exclude='/jenkins-data/_data/workspace/'
      --exclude='/jenkins-data/_data/jobs/***/builds/'