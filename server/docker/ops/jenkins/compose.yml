

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}.service: {{ param_role_name }}
  traefik.http.services.{{ param_role_name }}.loadbalancer.server.port: 8080

services:

  jenkins:
    image: "{{ param_registry }}/{{ param_registry_dir }}/jenkins:{{ param_role_version }}"
    container_name: jenkins
    build:
      context: {{ param_role_out_path }}
      dockerfile: Dockerfile
    privileged: true
    working_dir: /var/jenkins_home/
    labels:
      <<: *traefik-label
    ports:
      - "50000:50000"
    volumes:
      - {{ param_docker_data }}/{{ param_role_name }}/conf/:/conf/
      - {{ param_docker_data }}/{{ param_role_name }}/data/:/var/jenkins_home/
    environment:
      JAVA_OPTS: >-
        -Xverify:none
        -Dhudson.model.UpdateCenter.updateCenterUrl=https://{{ param_mirror_host }}/raw-hosted/jenkins/
        -Dhudson.model.DownloadService.noSignatureCheck=true -Djava.util.logging.config.file=/conf/logging.properties
    deploy:
      resources:
        limits:
          memory: 8g
    restart: always