

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}.service: {{ param_role_name }}
  traefik.http.services.{{ param_role_name }}.loadbalancer.server.port: 9000

services:

  sonarqube:
    image: sonarqube:25.8.0.112029-community
    container_name: sonarqube
    labels:
      <<: *traefik-label
    expose:
      - "9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data/
      - sonarqube_extensions:/opt/sonarqube/extensions/
      - sonarqube_logs:/opt/sonarqube/logs/
      - sonarqube_temp:/opt/sonarqube/temp/
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://{{ param_db_pgsql_host }}:{{ param_db_pgsql_port }}/sonarqube
      SONAR_JDBC_USERNAME: "{{ param_db_pgsql_username }}"
      SONAR_JDBC_PASSWORD: "{{ param_db_pgsql_password }}"
    restart: always

volumes:
  sonarqube_data:
    name: sonarqube_data
  sonarqube_extensions:
    name: sonarqube_extensions
  sonarqube_logs:
    name: sonarqube_logs
  sonarqube_temp:
    name: sonarqube_temp