

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}.service: {{ param_role_name }}
  traefik.http.services.{{ param_role_name }}.loadbalancer.server.port: 9000

services:

  sonarqube:
    image: sonarqube:25.8.0.112029-community
    container_name: sonarqube
    labels:
      <<: *traefik-label
    expose:
      - "9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data/
      - sonarqube-extensions:/opt/sonarqube/extensions/
      - sonarqube-logs:/opt/sonarqube/logs/
      - sonarqube-temp:/opt/sonarqube/temp/
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://{{ param_db_pgsql_host }}:{{ param_db_pgsql_port }}/sonarqube
      SONAR_JDBC_USERNAME: "{{ param_db_pgsql_username }}"
      SONAR_JDBC_PASSWORD: "{{ param_db_pgsql_password }}"
    restart: always

volumes:
  sonarqube-data:
    name: sonarqube-data
  sonarqube-extensions:
    name: sonarqube-extensions
  sonarqube-logs:
    name: sonarqube-logs
  sonarqube-temp:
    name: sonarqube-temp