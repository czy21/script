

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}-build-cache.service: {{ param_role_name }}-build-cache
  traefik.http.services.{{ param_role_name }}-build-cache.loadbalancer.server.port: 5071

services:

  gradle-build-cache:
    image: gradle/build-cache-node:21.2
    pull_policy: always
    container_name: gradle-build-cache
    hostname: gradle-build-cache
    labels:
      <<: *traefik-label
    privileged: true
    user: root
    expose:
      - "5071"
      - "6011"
    ports:
      - 6011:6011
    volumes:
      - {{ param_docker_data }}/{{ param_role_name }}/data/:/data/
    restart: always