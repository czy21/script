x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}.service: {{ param_role_name }}
  traefik.http.services.{{ param_role_name }}.loadbalancer.server.port: 8080

services:

  nacos:
    image: nacos/nacos-server:v3.3.0
    pull_policy: always
    container_name: "{{ param_role_name }}"
    hostname: "{{ param_role_name }}"
    privileged: true
    user: root
    labels:
      <<: *traefik-label
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      PREFER_HOST_MODE: hostname
      MODE: standalone
      NACOS_AUTH_TOKEN: {{ param_nacos_auth_token }}
      NACOS_AUTH_IDENTITY_KEY: {{ param_nacos_identity_key }}
      NACOS_AUTH_IDENTITY_VALUE: {{ param_nacos_identity_value }}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: "{{ param_db_mysql_host }}"
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: "{{ param_db_mysql_port }}"
      MYSQL_SERVICE_USER: "{{ param_db_mysql_username }}"
      MYSQL_SERVICE_PASSWORD: "{{ param_db_mysql_password }}"
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always