services:
  jenkins-ssh-agent:
    image: "{{ param_registry }}/{{ param_registry_dir }}/jenkins-ssh-agent:{{ param_role_version }}"
    container_name: jenkins-ssh-agent
    build:
      context: {{ param_role_out_path }}
      dockerfile: Dockerfile
    privileged: true
    ports:
      - "5022:22"
    volumes:
      - jenkins-ssh-agent_data:/home/jenkins/
      - jenkins-ssh-agent_empty:/home/jenkins/agent
      - jenkins-ssh-agent_empty:/home/jenkins/.jenkins
      - /run/:/run/
      - /var/run/:/var/run/
      - /tmp/:/tmp/
      - {{ param_docker_data }}/docker/conf/certs/:/docker-certs/client:ro
    environment:
      JENKINS_AGENT_SSH_PUBKEY: "{{ param_user_ssh_public_key }}"
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /docker-certs/client
      DOCKER_TLS_VERIFY: 1
    restart: always

volumes:
  jenkins-ssh-agent_data:
    name: jenkins-ssh-agent_data
  jenkins-ssh-agent_empty:
    name: jenkins-ssh-agent_empty