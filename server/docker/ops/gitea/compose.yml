x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}.service: {{ param_role_name }}
  traefik.http.services.{{ param_role_name }}.loadbalancer.server.port: 3000

services:

  gitea:
    image: gitea/gitea:1.27.3
    container_name: gitea
    labels:
      <<: *traefik-label
    privileged: true
    user: root
    expose:
      - "3000"
      - "22"
    ports:
      - "2226:22"
    volumes:
      - {{ param_docker_data }}/{{ param_role_name }}/data/:/data/
    environment:
      TZ: Asia/Shanghai
      GITEA__server__DOMAIN: gitea.czy21.com
      GITEA__server__SSH_DOMAIN: gitea.czy21.com:2226
      GITEA__server__ROOT_URL: "{{ param_gitea_instance_url }}"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__LANDING_PAGE: explore
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__server__LFS_ALLOW_PURE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__ALLOWED_HOST_LIST: "*"
      GITEA__database__DB_TYPE: mysql
      GITEA__database__NAME: gitea
      GITEA__database__HOST: "{{ param_db_mysql_host }}:{{ param_db_mysql_port }}"
      GITEA__database__USER: "{{ param_db_mysql_username }}"
      GITEA__database__PASSWD: "{{ param_db_mysql_password }}"
      GITEA__actions__ENABLED: "true"
      GITEA__packages__ENABLED: "true"
      GITEA__repository__USE_COMPAT_SSH_URI: "true"
      GITEA__ssh.minimum_key_sizes__RSA: 2048
      GITEA__attachment__MAX_SIZE: 1024
      GITEA__attachment__MAX_FILES: 20
      GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__OPENID_CONNECT_SCOPES: openid profile email gitea
    restart: always