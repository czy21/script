

x-traefik-label: &traefik-label
  traefik.enable: true
  traefik.http.routers.{{ param_role_name }}.service: {{ param_role_name }}
  traefik.http.services.{{ param_role_name }}.loadbalancer.server.port: 8080

services:

  kaoto:
    image: {{ param_registry_proxy if param_proxy and param_registry_proxy else 'quay.io' }}/kaotoio/kaoto-app:2.3.0
    container_name: kaoto
    labels:
      <<: *traefik-label
    privileged: true
    user: root
    restart: always