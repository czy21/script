

services:

  mssql:
    image: {{ param_registry_proxy if param_proxy and param_registry_proxy else 'mcr.microsoft.com' }}/mssql/server:2022-latest
    container_name: mssql
    privileged: true
    user: root
    ports:
      - "1433:1433"
    volumes:
      - {{ param_docker_data }}/{{ param_role_name }}/data/:/var/opt/mssql/
    environment:
      TZ: Asia/Shanghai
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: {{ param_db_mssql_password }}
      MSSQL_COLLATION: Chinese_PRC_CI_AS
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G

